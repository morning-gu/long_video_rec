<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>长视频推荐 Demo</title>
<style>
  :root {
    --bg: #0e0e10;
    --bg-panel: #17171a;
    --bg-card: #1b1b1f;
    --bg-hover: #232329;
    --border: #2a2a30;
    --border-soft: #222227;
    --text: #ececec;
    --text-dim: #9a9aa2;
    --text-faint: #6b6b74;
    --accent: #e50914;
    --accent-soft: rgba(229, 9, 20, .14);
    --ai: #8b5cf6;
    --ai-soft: rgba(139, 92, 246, .15);
    --good: #4ade80;
    --warn: #f4b04a;
    --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; }
  html { scrollbar-color: #3a3a42 transparent; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  ::-webkit-scrollbar { height: 8px; width: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #34343c; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #45454f; }

  /* ---------- 顶栏 ---------- */
  header {
    position: sticky; top: 0; z-index: 20;
    background: linear-gradient(180deg, rgba(20,20,24,.98), rgba(14,14,16,.96));
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border-soft);
    padding: 14px 28px 12px;
  }
  .brand { display: flex; align-items: baseline; gap: 12px; }
  .brand h1 { font-size: 19px; font-weight: 700; letter-spacing: .5px; }
  .brand h1 .dot {
    display: inline-block; width: 10px; height: 10px; border-radius: 3px;
    background: linear-gradient(135deg, var(--accent), #ff5a4a);
    margin-right: 9px; transform: translateY(-1px);
  }
  .brand .sub { font-size: 12px; color: var(--text-faint); letter-spacing: .3px; }

  .controls {
    display: flex; gap: 10px; margin-top: 13px; flex-wrap: wrap; align-items: center;
  }
  select, input, button {
    background: var(--bg-panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 12px; font-size: 13px; outline: none;
    transition: border-color .15s, box-shadow .15s, background .15s;
  }
  select:focus, input:focus {
    border-color: #5a5a66;
    box-shadow: 0 0 0 3px rgba(120, 120, 140, .12);
  }
  input[type=number] { width: 150px; }
  button { cursor: pointer; }
  button:hover { background: var(--bg-hover); }

  .seg { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .seg button { border: none; border-radius: 0; padding: 8px 14px; color: var(--text-dim); }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button.on { background: var(--accent); color: #fff; font-weight: 600; }

  #llmToggle.on {
    background: var(--ai-soft); border-color: var(--ai); color: #c4b0f5;
  }
  #refresh { font-weight: 600; padding: 8px 16px; }

  .profile {
    margin-top: 12px; font-size: 12px; color: var(--text-faint);
    display: flex; gap: 7px; flex-wrap: wrap; align-items: center; max-width: 100%;
  }
  .profile .chip {
    background: var(--bg-panel); border: 1px solid var(--border-soft);
    border-radius: 20px; padding: 3px 11px; color: var(--text-dim);
    max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  /* ---------- 行 ---------- */
  main { padding: 22px 28px 70px; }
  section { margin-bottom: 34px; animation: rise .35s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  section h2 {
    font-size: 15px; font-weight: 700; letter-spacing: .3px;
    margin-bottom: 13px; display: flex; align-items: center; gap: 10px;
  }
  section h2::before {
    content: ""; width: 4px; height: 16px; border-radius: 2px;
    background: linear-gradient(180deg, var(--accent), #ff6a4a);
  }
  section h2 .note {
    font-size: 12px; color: var(--warn); font-weight: 500;
    background: rgba(244, 176, 74, .1); border-radius: 6px; padding: 2px 8px;
  }
  #llmStatus {
    font-size: 11px; padding: 3px 10px; border-radius: 20px;
    display: none; align-items: center; gap: 6px; font-weight: 500;
  }
  #llmStatus.pending { display: inline-flex; background: var(--ai-soft); color: #b9a3f2; }
  #llmStatus.pending::before {
    content: ""; width: 6px; height: 6px; border-radius: 50%;
    background: var(--ai); animation: pulse 1s infinite;
  }
  @keyframes pulse { 50% { opacity: .25; } }
  #llmStatus.done { display: inline-flex; background: rgba(74, 222, 128, .12); color: var(--good); }
  #llmStatus.fallback { display: inline-flex; background: rgba(154, 154, 162, .12); color: var(--text-dim); }

  .row { display: flex; gap: 13px; overflow-x: auto; padding: 4px 2px 12px; }

  /* ---------- 卡片 ---------- */
  .card {
    min-width: 170px; max-width: 170px; flex-shrink: 0;
    border-radius: var(--radius); padding: 9px;
    background: var(--bg-card); border: 1px solid var(--border-soft);
    cursor: pointer; position: relative;
    transition: transform .18s ease, border-color .18s, box-shadow .18s, background .18s;
  }
  .card:hover {
    transform: translateY(-5px);
    border-color: #4a4a55;
    box-shadow: 0 14px 34px rgba(0, 0, 0, .55);
    background: var(--bg-hover);
  }
  .card .poster {
    position: relative; height: 242px; border-radius: 7px; overflow: hidden;
    background: linear-gradient(160deg, #232329, #151518);
    margin-bottom: 9px;
  }
  .card .poster .ph {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 19px; font-weight: 700; color: rgba(255, 255, 255, .5);
    text-align: center; padding: 0 10px;
  }
  .card .poster img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; opacity: 0; transition: opacity .4s ease;
  }
  .card .poster img.loaded { opacity: 1; }
  .card .no {
    position: absolute; top: 7px; right: 7px; z-index: 2;
    width: 24px; height: 24px; border-radius: 50%;
    background: rgba(0, 0, 0, .62); color: #bbb; border: none;
    font-size: 12px; line-height: 1; padding: 0;
    opacity: 0; transition: opacity .15s, color .15s;
    backdrop-filter: blur(4px);
  }
  .card:hover .no { opacity: 1; }
  .card .no:hover { color: var(--accent); background: rgba(0, 0, 0, .85); }

  .card .title {
    font-size: 13px; font-weight: 600; line-height: 1.4; height: 36px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card .genres {
    font-size: 11px; color: var(--text-faint); margin-top: 5px; height: 16px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .card .reason {
    font-size: 11.5px; color: #d9b877; margin-top: 6px; height: 32px;
    line-height: 1.42; overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .card .meta {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 8px; font-size: 11px;
  }
  .card .score {
    color: var(--good); font-weight: 700;
    background: rgba(74, 222, 128, .1); padding: 1px 7px; border-radius: 5px;
  }
  .badge { padding: 1px 7px; border-radius: 5px; font-size: 10.5px; font-weight: 600; }
  .badge.itemcf   { background: rgba(96, 165, 250, .13); color: #7cb6ff; }
  .badge.twotower { background: rgba(167, 139, 250, .13); color: #b9a3f2; }
  .badge.sasrec   { background: rgba(45, 212, 191, .13); color: #4fd8c3; }
  .badge.hot      { background: rgba(244, 176, 74, .13); color: var(--warn); }
  .badge.cold     { background: rgba(244, 114, 182, .13); color: #f29ec5; }
  .badge.query    { background: rgba(129, 140, 248, .15); color: #a5b0ff; }
  .badge.lightgcn { background: rgba(163, 230, 53, .13); color: #b4ec6a; }
  .badge.semantic { background: rgba(34, 211, 238, .13); color: #5ad9ec; }

  /* 用户搜索下拉（M6+） */
  .userbox { position: relative; }
  .userbtn { min-width: 200px; text-align: left; font-weight: 600; }
  .usermenu {
    position: absolute; top: calc(100% + 6px); left: 0; z-index: 50;
    width: 280px; background: #1a1a1e; border: 1px solid var(--border);
    border-radius: 10px; padding: 8px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, .55);
  }
  .usermenu input { width: 100%; margin-bottom: 6px; }
  .userlist { max-height: 250px; overflow-y: auto; }
  .uitem {
    display: flex; justify-content: space-between; align-items: center;
    width: 100%; padding: 7px 10px; border: none; border-radius: 7px;
    background: none; color: var(--text); font-size: 13px; cursor: pointer;
    text-align: left;
  }
  .uitem:hover { background: var(--bg-hover); }
  .uitem .pos { color: var(--text-faint); font-size: 11.5px; }
  .uitem.cur { background: rgba(229, 9, 20, .12); color: #ff9a93; }
  .newuser {
    width: 100%; margin-top: 6px; padding: 7px; border-radius: 7px;
    border: 1px dashed #4a4a55; background: none; color: var(--text-dim);
    font-size: 12.5px; cursor: pointer;
  }
  .newuser:hover { color: var(--text); border-color: #6a6a75; }

  /* 通道/阶段切换（M6+ 消融面板） */
  .chiprow { display: flex; gap: 7px; margin-top: 10px; flex-wrap: wrap;
             align-items: center; font-size: 12px; }
  .chiprow .lbl { color: var(--text-faint); }
  #channelChips { display: flex; gap: 6px; flex-wrap: wrap; }
  .tch {
    background: var(--bg-panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 3px 12px; color: var(--text-dim);
    cursor: pointer; font-size: 12px; transition: all .15s;
  }
  .tch:hover { border-color: #5a5a66; }
  .tch.on { background: rgba(229, 9, 20, .13); border-color: rgba(229, 9, 20, .5); color: #ff9a93; }
  .seg.small button { padding: 4px 11px; font-size: 12px; }

  #queryInput { width: 230px; }
  .navlink {
    text-decoration: none; font-size: 13px; color: var(--text-dim);
    padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px;
    transition: border-color .15s, color .15s;
  }
  .navlink:hover { color: var(--text); border-color: #5a5a66; }
  #cmpToggle.on { background: rgba(74, 222, 128, .12); border-color: #3f7a52; color: #7ee09a; }

  /* 对比模式 */
  .cmp {
    background: var(--bg-panel); border: 1px solid var(--border-soft);
    border-radius: var(--radius); padding: 14px 18px; margin-bottom: 22px;
    animation: rise .35s ease both;
  }
  .cmp-title { font-size: 14px; font-weight: 700; margin-bottom: 11px; }
  .cmp-title .note {
    font-size: 12px; color: var(--text-faint); font-weight: 400; margin-left: 8px;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; font-size: 12px; }
  .chips .chip {
    border-radius: 20px; padding: 4px 12px;
    background: var(--bg-card); border: 1px solid var(--border-soft);
    color: var(--text-dim);
  }
  .chips .chip.a { border-color: rgba(229, 9, 20, .55); color: #ff9a93; }
  .chips .chip.b { border-color: #3d3d46; }
  .chips .chip.a b, .chips .chip.b b { font-size: 13px; }
  .clearq {
    margin-left: auto; font-size: 11px; color: var(--text-faint);
    background: none; border: 1px solid var(--border-soft); border-radius: 12px;
    padding: 2px 10px;
  }
  .clearq:hover { color: var(--text); border-color: #5a5a66; }

  /* ---------- 详情浮层 ---------- */
  body.lock { overflow: hidden; }
  .dmodal { position: fixed; inset: 0; z-index: 40; display: none; }
  .dmodal.open { display: block; }
  .dbackdrop { position: absolute; inset: 0; background: rgba(6, 6, 8, .8); }
  .dpanel {
    position: relative; margin: 4vh auto 0; width: min(860px, 94vw);
    max-height: 92vh; overflow-y: auto;
    background: #141417; border: 1px solid var(--border);
    border-radius: 14px; padding: 24px 26px 20px;
    animation: rise .25s ease;
  }
  .dclose {
    position: absolute; top: 14px; right: 14px; z-index: 2;
    width: 30px; height: 30px; border-radius: 50%;
    background: rgba(0, 0, 0, .55); color: #bbb; border: none; font-size: 13px;
  }
  .dclose:hover { color: #fff; background: rgba(229, 9, 20, .75); }
  .dmain { display: flex; gap: 24px; }
  .dposter {
    width: 236px; flex-shrink: 0; aspect-ratio: 2 / 3;
    border-radius: 10px; overflow: hidden; position: relative;
    background: linear-gradient(160deg, #232329, #151518);
  }
  .dposter img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover;
  }
  .dposter .ph {
    position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; font-size: 26px; font-weight: 700;
    color: rgba(255, 255, 255, .5); text-align: center; padding: 0 12px;
  }
  .dinfo { flex: 1; min-width: 0; padding-top: 4px; }
  .dinfo h3 { font-size: 21px; line-height: 1.3; margin-bottom: 10px; }
  .dinfo h3 .yr { color: var(--text-faint); font-weight: 400; font-size: 15px; }
  .gchips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .gchip {
    font-size: 11.5px; color: var(--text-dim); border: 1px solid var(--border);
    border-radius: 14px; padding: 2px 10px;
  }
  .dstats { font-size: 12.5px; color: var(--text-dim); line-height: 1.9; }
  .dstats b { color: var(--warn); font-weight: 600; }
  .dflags { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }
  .dflags .tag { font-size: 11px; border-radius: 5px; padding: 2px 8px; }
  .dflags .seen { background: rgba(74, 222, 128, .12); color: var(--good); }
  .dflags .mark { background: rgba(139, 92, 246, .14); color: #b9a3f2; }
  .dflags .supp { background: rgba(229, 9, 20, .12); color: #ff8d86; }
  .dslot {
    margin: 2px 0 12px; padding: 9px 12px; border-radius: 8px;
    font-size: 12.5px; line-height: 1.65;
  }
  .dslot.reason {
    background: rgba(244, 176, 74, .07); border-left: 3px solid var(--warn);
    color: #d9b877;
  }
  .dslot.brief {
    background: rgba(129, 140, 248, .06); border-left: 3px solid #6a6bd8;
    color: var(--text-dim);
  }
  .dslot .rlabel {
    display: inline-block; font-size: 10.5px; font-weight: 700;
    margin-right: 8px; opacity: .75;
  }
  .dslot .dim { color: var(--text-faint); font-size: 12px; }
  .dactions { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  .act { padding: 9px 18px; border-radius: 9px; font-weight: 600; font-size: 13.5px; }
  .act.like { background: rgba(74, 222, 128, .12); border-color: #3f7a52; color: #7ee09a; }
  .act.like:hover { background: rgba(74, 222, 128, .2); }
  .act.dislike { background: rgba(229, 9, 20, .1); border-color: #7a3f42; color: #ff9a93; }
  .act.dislike:hover { background: rgba(229, 9, 20, .18); }
  .act.watched { background: var(--bg-hover); border-color: var(--border); color: var(--text-dim); }
  .drate {
    margin-top: 16px; display: flex; align-items: center; gap: 10px;
    font-size: 12.5px; color: var(--text-dim); flex-wrap: wrap;
  }
  .stars { display: flex; gap: 2px; }
  .stars button {
    background: none; border: none; font-size: 21px; line-height: 1;
    color: #35353d; padding: 0 1px; cursor: pointer;
    transition: color .1s, transform .1s;
  }
  .stars button.on { color: var(--warn); }
  .stars button:hover { transform: scale(1.18); }
  .rhint { font-size: 11px; color: var(--text-faint); }
  .dsimilar {
    margin-top: 22px; border-top: 1px solid var(--border-soft); padding-top: 16px;
  }
  .dsimilar h4 {
    font-size: 12.5px; color: var(--text-faint); margin-bottom: 11px;
    font-weight: 600; letter-spacing: .4px;
  }
  .mini { width: 112px; flex-shrink: 0; cursor: pointer; }
  .mini .mp {
    position: relative; height: 158px; border-radius: 7px; overflow: hidden;
    background: linear-gradient(160deg, #232329, #151518); margin-bottom: 6px;
    transition: transform .15s;
  }
  .mini:hover .mp { transform: translateY(-3px); }
  .mini .mp img {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
  }
  .mini .mp .ph {
    position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; font-size: 13px; font-weight: 700;
    color: rgba(255, 255, 255, .5);
  }
  .mini .mt {
    font-size: 11px; line-height: 1.4; color: var(--text-dim);
    height: 30px; overflow: hidden;
  }
  .mini:hover .mt { color: var(--text); }

  /* ---------- 骨架屏 ---------- */
  .sk-card {
    min-width: 170px; height: 385px; flex-shrink: 0;
    border-radius: var(--radius); background: var(--bg-card);
    border: 1px solid var(--border-soft); padding: 9px;
  }
  .sk-card .sk { border-radius: 7px; background: linear-gradient(100deg, #202026 40%, #2a2a33 50%, #202026 60%); background-size: 200% 100%; animation: shimmer 1.2s infinite linear; }
  .sk-card .sk.p { height: 242px; margin-bottom: 9px; }
  .sk-card .sk.t { height: 14px; width: 88%; margin-bottom: 7px; }
  .sk-card .sk.g { height: 11px; width: 60%; }
  @keyframes shimmer { to { background-position: -200% 0; } }

  /* ---------- 其他 ---------- */
  #toast {
    position: fixed; right: 22px; bottom: 22px; z-index: 30;
    background: #232a23; border: 1px solid #365536; color: #9fe0a2;
    padding: 11px 17px; border-radius: 9px; font-size: 13px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .5);
    opacity: 0; transform: translateY(8px);
    transition: opacity .25s, transform .25s; pointer-events: none;
  }
  #toast.show { opacity: 1; transform: none; }

  @media (max-width: 760px) {
    header { padding: 12px 16px 10px; }
    main { padding: 16px 16px 60px; }
    .brand .sub { display: none; }
    .card, .sk-card { min-width: 138px; max-width: 138px; }
    .card .poster, .sk-card .sk.p { height: 196px; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1><span class="dot"></span>长视频推荐 Demo</h1>
    <span class="sub">四段漏斗 · LLM 增强 · 实时回流 · 消融对照</span>
  </div>
  <div class="controls">
    <div class="userbox" id="userBox">
      <button class="userbtn" id="userBtn">👤 用户 —</button>
      <div class="usermenu" id="userMenu" hidden>
        <input id="userSearch" type="text" placeholder="搜索用户 ID…" autocomplete="off">
        <div class="userlist" id="userList"></div>
        <button class="newuser" id="newUserBtn">＋ 创建新用户（冷启动演示）</button>
      </div>
    </div>
    <input id="queryInput" type="text" placeholder="来部轻松的科幻片…" maxlength="60">
    <button id="queryBtn" title="自然语言查询（LLM 解析 → 类型过滤 + 双塔检索）">🔍 查询</button>
    <div class="seg">
      <button id="modeFull" class="on">完整链路</button>
      <button id="modePopular">纯热门</button>
    </div>
    <button id="llmToggle" class="on" title="LLM 重排 + 推荐理由（失败自动降级）">✨ LLM 增强</button>
    <button id="cmpToggle" title="同屏对比：完整链路 vs 纯热门（O3 消融）">⚖️ 对比</button>
    <button id="refresh">↻ 刷新</button>
    <a class="navlink" href="/eval" target="_blank" title="离线评测报告">📊 评测报告</a>
  </div>
  <div class="chiprow">
    <span class="lbl">召回</span>
    <span id="channelChips"></span>
    <span class="lbl" style="margin-left:8px">粗排</span>
    <div class="seg small" id="coarseSeg">
      <button data-co="keep" class="on" title="通道保持式压缩：每通道保留头部配额，只过滤不重排（M3 修订版，默认）">压缩</button>
      <button data-co="tt" title="双塔点积 + 口碑先验全局重排（M3 初版；评测显示其压制强通道头部，HR 0.186→0.119，保留用于对比演示）">双塔</button>
      <button data-co="none" title="跳过粗排，融合候选直通精排">跳过</button>
    </div>
    <span class="lbl" style="margin-left:8px">精排</span>
    <div class="seg small" id="rankerSeg"></div>
    <span class="lbl" style="margin-left:8px">重排</span>
    <div class="seg small" id="rrSeg"></div>
  </div>
  <div id="profile" class="profile"></div>
</header>
<main id="rows"></main>
<div class="dmodal" id="detailModal"></div>
<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
let curUser = null, curMode = 'full', llmOn = true, compareOn = false;
let lastTopIds = [], llmSeq = 0, queryResult = null;
let curRanker = 'v1', curRerank = 'mmr', curCoarse = 'keep';

function esc(s) {
  return String(s).replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
const SRC_NAME = {itemcf:'ItemCF', twotower:'双塔', sasrec:'序列',
                  hot:'热门', cold:'冷门', query:'查询',
                  lightgcn:'LightGCN', semantic:'语义'};
const srcName = s => SRC_NAME[s] || s;

const RANKER_LABEL = {v1: 'v1·DeepFM', v2: 'v2·+内容', none: '无'};
const RR_LABEL = {mmr: 'MMR', dpp: 'DPP', none: '无'};

async function loadMeta() {
  const m = await (await fetch('/api/meta')).json();
  $('channelChips').innerHTML = m.channels.map(c =>
    `<button class="tch on" data-ch="${esc(c)}" title="点击启停该召回通道（多选）">${srcName(c)}</button>`
  ).join('');
  $('rankerSeg').innerHTML = m.rankers.map(v =>
    `<button class="${v === curRanker ? 'on' : ''}" data-v="${v}"
             title="${v === 'none' ? '跳过精排，粗排候选直通规则重排' : ''}">
      ${RANKER_LABEL[v] || v}</button>`).join('');
  $('rankerSeg').onclick = e => {
    const b = e.target.closest('button[data-v]');
    if (!b) return;
    curRanker = b.dataset.v;
    $('rankerSeg').querySelectorAll('button').forEach(
      x => x.classList.toggle('on', x === b));
    refresh();
  };
  $('rrSeg').innerHTML = m.rerankers.map(v =>
    `<button class="${v === curRerank ? 'on' : ''}" data-v="${v}"
             title="${v === 'none' ? '仅规则重排（无多样性算法）' : ''}">
      ${RR_LABEL[v] || v}</button>`).join('');
  $('rrSeg').onclick = e => {
    const b = e.target.closest('button[data-v]');
    if (!b) return;
    curRerank = b.dataset.v;
    $('rrSeg').querySelectorAll('button').forEach(
      x => x.classList.toggle('on', x === b));
    refresh();
  };
}

function channelParam() {
  return [...document.querySelectorAll('#channelChips .tch.on')]
    .map(b => b.dataset.ch).join(',');
}

let userPool = [];

async function loadUsers() {
  const r = await (await fetch('/api/users')).json();
  userPool = r.sample_users;
  curUser = userPool[0].user_id;
  updateUserBtn();
  renderUserList('');
}

function updateUserBtn() {
  const p = userPool.find(x => x.user_id === curUser);
  $('userBtn').textContent = p
    ? `👤 用户 ${curUser} · ${p.positives} 部正反馈`
    : `👤 用户 ${curUser}（新用户）`;
}

function renderUserList(q) {
  q = String(q || '').trim();
  const list = userPool.filter(u => !q || String(u.user_id).includes(q));
  const shown = q ? list : list.slice(0, 5);        // 默认展示 5 个高活跃用户
  let html = shown.map(u =>
    `<button class="uitem ${u.user_id === curUser ? 'cur' : ''}" data-id="${u.user_id}">
       <span>用户 ${u.user_id}</span><span class="pos">${u.positives} 部正反馈</span>
     </button>`).join('');
  // 纯数字且未在列表中 → 直达（ML-1M 用户段 1..6040 连续，任意 ID 均存在）
  if (/^\d+$/.test(q)) {
    const n = parseInt(q, 10);
    if (n >= 1 && !list.some(u => u.user_id === n)) {
      html += `<button class="uitem" data-id="${n}">
                 <span>选择用户 ${n}</span><span class="pos">直接跳转</span>
               </button>`;
    }
  }
  if (!html) {
    html = '<div style="padding:10px;color:var(--text-faint);font-size:12px">'
         + '无匹配用户，输入数字可直达任意用户 ID</div>';
  }
  $('userList').innerHTML = html;
}

function selectUser(id) {
  curUser = id;
  updateUserBtn();
  toggleUserMenu(false);
  refresh();
}

function toggleUserMenu(show) {
  const m = $('userMenu');
  m.hidden = !(show === undefined ? m.hidden : show);
  if (!m.hidden) {
    $('userSearch').value = '';
    renderUserList('');
    $('userSearch').focus();
  }
}

function showSkeleton() {
  const sk = `<div class="sk-card"><div class="sk p"></div><div class="sk t"></div><div class="sk g"></div></div>`;
  const row = () => `<section><h2>加载中…</h2><div class="row">${sk.repeat(8)}</div></section>`;
  $('rows').innerHTML = row() + row() + row('');
}

function renderProfile(profile) {
  $('profile').innerHTML = (profile.recent || []).length
    ? '<span>最近看过：</span>' +
      profile.recent.map(t => `<span class="chip">${esc(t)}</span>`).join('')
    : '<span class="chip">暂无历史（冷启动用户）</span>';
}

function rowHTML(row) {
  return `<section>
    <h2>${esc(row.title)}
        ${row.note ? `<span class="note">${esc(row.note)}</span>` : ''}
        ${row.key === 'for_you' ? '<span id="llmStatus"></span>' : ''}
        ${row.clear ? '<button class="clearq" onclick="clearQuery()">✕ 清除</button>' : ''}
    </h2>
    <div class="row" ${row.key === 'for_you' ? 'id="forYouRow"' : ''}>
      ${row.movies.map(card).join('')}
    </div>
  </section>`;
}

function querySection() {
  const q = queryResult;
  const g = q.genres.length ? q.genres.join(' / ') : '未识别 · 热度兜底';
  return {key: 'query', clear: true, title: `🔍「${q.text}」`,
          note: `${g}${q.mood ? ' · ' + esc(q.mood) : ''}${q.degraded ? ' · 解析降级' : ''}`,
          movies: q.movies};
}

async function refresh() {
  if (curUser == null) return;
  showSkeleton();
  try {
    if (compareOn) await refreshCompare();
    else await refreshNormal();
  } catch (e) {
    $('rows').innerHTML = '<section><h2>加载失败，请刷新重试</h2></section>';
  }
}

async function refreshNormal() {
  const r = await (await fetch(
      `/api/recommend?user_id=${curUser}&mode=${curMode}` +
      `&rerank=${curRerank}&ranker=${curRanker}&coarse=${curCoarse}` +
      `&channels=${encodeURIComponent(channelParam())}`
  )).json();
  renderProfile(r.profile);
  const sections = queryResult ? [querySection(), ...r.rows] : r.rows;
  $('rows').innerHTML = sections.map(rowHTML).join('');
  lastTopIds = r.rows[0].movies.map(m => m.movie_id);
  if (llmOn && curMode === 'full') llmEnhance();
}

async function refreshCompare() {
  const r = await (await fetch(
      `/api/compare?user_id=${curUser}` +
      `&rerank=${curRerank}&ranker=${curRanker}&coarse=${curCoarse}` +
      `&channels=${encodeURIComponent(channelParam())}`
  )).json();
  renderProfile(r.profile);
  const m = r.metrics;
  const pct = x => (x * 100).toFixed(0) + '%';
  const bar = `<section class="cmp">
    <div class="cmp-title">同屏对比 · 同一用户同一时刻
      <span class="note">O3 消融：红色为完整链路指标</span></div>
    <div class="chips">
      <span class="chip a">类型覆盖 <b>${m.full.genre_diversity}</b> vs <b>${m.popular.genre_diversity}</b></span>
      <span class="chip a">长尾占比 <b>${pct(m.full.longtail)}</b> vs <b>${pct(m.popular.longtail)}</b></span>
      <span class="chip a">平均口碑 <b>${m.full.avg_wr}</b> vs <b>${m.popular.avg_wr}</b></span>
      <span class="chip b">两列表重合 <b>${m.overlap}/20</b></span>
    </div>
  </section>`;
  $('rows').innerHTML =
    (queryResult ? rowHTML(querySection()) : '') + bar +
    rowHTML({key: 'for_you', title: '完整链路（个性化）',
             note: '四段漏斗 + LLM 增强', movies: r.full}) +
    rowHTML({key: 'popular', title: '纯热门（非个性化）',
             note: '消融基线', movies: r.popular});
  lastTopIds = r.full.map(m => m.movie_id);
  if (llmOn) llmEnhance();
}

async function doQuery() {
  const t = $('queryInput').value.trim();
  if (!t || curUser == null) return;
  $('queryInput').value = '';
  const r = await (await fetch('/api/query', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({user_id: curUser, text: t})
  })).json();
  queryResult = r;
  refresh();
}

function clearQuery() {
  queryResult = null;
  refresh();
}

function card(m) {
  const hue = (m.movie_id * 47) % 360;
  const g = m.genres[0] || '—';
  const poster = m.poster
    ? `<img src="${esc(m.poster)}" loading="lazy" alt=""
             onload="this.classList.add('loaded')" onerror="this.remove()">`
    : '';
  return `<div class="card" data-id="${m.movie_id}"
              title="${esc(m.title)}&#10;点击查看详情">
    <div class="poster">
      <button class="no" title="不感兴趣（负反馈）">✕</button>
      <div class="ph" style="background:linear-gradient(155deg,hsl(${hue},32%,26%),hsl(${hue},20%,12%))">${esc(g)}</div>
      ${poster}
    </div>
    <div class="title">${esc(m.title)}</div>
    <div class="genres">${esc(m.genres.join(' · '))}</div>
    <div class="reason" id="rs-${m.movie_id}"></div>
    <div class="meta">
      <span class="score">${m.score.toFixed(2)}</span>
      <span class="badge ${esc(m.source)}">${srcName(m.source)}</span>
    </div>
  </div>`;
}

// ---- 详情浮层（动作体系：喜欢/看完/不感兴趣/评分，便于继续扩展）----

let detail = null;

async function openDetail(mid) {
  try {
    detail = await (await fetch(`/api/movie/${mid}?user_id=${curUser}`)).json();
  } catch (e) {
    toast('详情加载失败');
    return;
  }
  renderDetail();
}

function closeModal() {
  $('detailModal').classList.remove('open');
  document.body.classList.remove('lock');
  detail = null;
}

function yearOf(title) {
  const m = String(title).match(/\((\d{4})\)\s*$/);
  return m ? m[1] : '';
}

function miniCard(m) {
  const hue = (m.movie_id * 47) % 360;
  const g = m.genres[0] || '—';
  return `<div class="mini" data-id="${m.movie_id}" title="${esc(m.title)}">
    <div class="mp">
      <div class="ph" style="background:linear-gradient(155deg,hsl(${hue},32%,26%),hsl(${hue},20%,12%))">${esc(g)}</div>
      ${m.poster ? `<img src="${esc(m.poster)}" loading="lazy" alt="" onerror="this.remove()">` : ''}
    </div>
    <div class="mt">${esc(m.title)}</div>
  </div>`;
}

function renderDetail() {
  const d = detail;
  const y = yearOf(d.title);
  const hue = (d.movie_id * 47) % 360;
  const g0 = d.genres[0] || '—';
  // 关系归因标签（消除"已看过"歧义）：历史评分 vs 演示期动作
  const flags = [];
  if (d.history_rating)
    flags.push(`<span class="tag seen">看过 · 你评过 ${d.history_rating} 分</span>`);
  if (d.marked) {
    const m = d.marked;
    const neg = m.action === 'dislike' ||
                (m.action === 'rate' && m.value <= 2);
    const lbl = m.action === 'rate' ? `你评了 ${m.value} 星`
      : {like: '已标记 👍 喜欢', watched: '已标记 ✅ 看完',
         dislike: '⊘ 已屏蔽', click: '已标记看过'}[m.action] || m.action;
    flags.push(`<span class="tag ${neg ? 'supp' : 'mark'}">${lbl}</span>`);
  }
  $('detailModal').innerHTML = `
    <div class="dbackdrop" onclick="closeModal()"></div>
    <div class="dpanel">
      <button class="dclose" onclick="closeModal()" title="关闭 (Esc)">✕</button>
      <div class="dmain">
        <div class="dposter">
          <div class="ph" style="background:linear-gradient(155deg,hsl(${hue},32%,26%),hsl(${hue},20%,12%))">${esc(g0)}</div>
          ${d.poster ? `<img src="${esc(d.poster)}" alt="">` : ''}
        </div>
        <div class="dinfo">
          <h3>${esc(d.title)} ${y ? `<span class="yr">(${y})</span>` : ''}</h3>
          <div class="gchips">
            ${d.genres.map(g => `<span class="gchip">${esc(g)}</span>`).join('')}
          </div>
          <div class="dslot reason" id="dslot"></div>
          <div class="dstats">
            口碑 <b>${d.wr.toFixed(1)}</b> / 5 &nbsp;·&nbsp;
            ${d.pos_count} 人好评 &nbsp;·&nbsp; 热门排名 #${d.pop_rank}
          </div>
          ${flags.length ? `<div class="dflags">${flags.join('')}</div>` : ''}
          <div class="dactions">
            <button class="act like" onclick="detailAction('like')">👍 喜欢</button>
            <button class="act watched" onclick="detailAction('watched')">✅ 看完</button>
            <button class="act dislike" onclick="detailAction('dislike')">👎 不感兴趣</button>
          </div>
          <div class="drate">
            <span>评分：</span>
            <span class="stars">${[1, 2, 3, 4, 5].map(v =>
              `<button onclick="detailAction('rate', ${v})"
                       onmouseenter="starHover(${v})" onmouseleave="starHover(0)">★</button>`
            ).join('')}</span>
            <span class="rhint">≥4 星记为正反馈 · ≤2 星记为负反馈</span>
          </div>
        </div>
      </div>
      ${d.similar.length ? `
      <div class="dsimilar">
        <h4>相似推荐（ItemCF · 共现相似）</h4>
        <div class="row">${d.similar.map(miniCard).join('')}</div>
      </div>` : ''}
    </div>`;
  // 槽位优先级：✨ 推荐理由 → AI 简介（异步生成）→ 隐藏
  const slot = $('dslot');
  if (d.reason) {
    slot.innerHTML = `<span class="rlabel">✨ 推荐理由</span>${esc(d.reason)}`;
  } else {
    slot.className = 'dslot brief';
    slot.innerHTML = `<span class="dim">AI 简介生成中…</span>`;
    fetchSynopsis(d.movie_id);
  }
  $('detailModal').classList.add('open');
  document.body.classList.add('lock');
}

async function fetchSynopsis(mid) {
  try {
    const r = await (await fetch('/api/synopsis', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({movie_id: mid})
    })).json();
    const slot = $('dslot');
    if (!slot || !detail || detail.movie_id !== mid) return;   // 已切换/关闭
    if (r.synopsis) {
      slot.innerHTML = `<span class="rlabel">AI 简介</span>${esc(r.synopsis)}`;
    } else {
      slot.style.display = 'none';      // 无数据：宁缺毋滥，隐藏槽位
    }
  } catch (e) {
    const slot = $('dslot');
    if (slot) slot.style.display = 'none';
  }
}

function starHover(v) {
  document.querySelectorAll('.stars button').forEach((b, i) =>
    b.classList.toggle('on', i < v));
}

async function detailAction(action, value = null) {
  const d = detail;
  if (!d) return;
  closeModal();
  await postEvent(d.movie_id, action, value);
  const label = {
    like: '已标记 👍 喜欢', watched: '已标记 ✅ 看完',
    dislike: '已记录 👎 负反馈', rate: `已评分 ${value} 星`,
  }[action];
  toast(label + '，推荐已实时更新');
  refresh();
}

// ---- LLM 增强（异步，主链路零依赖）----

async function llmEnhance() {
  const seq = ++llmSeq;
  const st = $('llmStatus');
  if (!st) return;
  st.className = 'pending';
  st.textContent = 'AI 增强中…';
  try {
    const r = await (await fetch('/api/llm_enhance', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({user_id: curUser, movie_ids: lastTopIds})
    })).json();
    if (seq !== llmSeq || !document.getElementById('forYouRow')) return; // 过期响应
    const cards = {};
    document.querySelectorAll('#forYouRow .card')
      .forEach(el => cards[el.dataset.id] = el);
    if (r.order && r.order.length) {
      const row = document.getElementById('forYouRow');
      r.order.forEach(id => { if (cards[id]) row.appendChild(cards[id]); });
    }
    for (const [id, text] of Object.entries(r.reasons || {})) {
      const el = document.getElementById('rs-' + id);
      if (el) el.textContent = '✨ ' + text;
    }
    if (r.degraded) { st.className = 'fallback'; st.textContent = 'AI 降级 · 模型排序'; }
    else { st.className = 'done'; st.textContent = '✓ AI 已增强'; }
  } catch (e) {
    if (seq !== llmSeq) return;
    st.className = 'fallback';
    st.textContent = 'AI 不可用 · 已降级';
  }
}

async function postEvent(movieId, action, value = null) {
  await fetch('/api/event', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({user_id: curUser, movie_id: movieId, action, value})
  });
}

let toastTimer = null;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

document.addEventListener('click', async e => {
  const no = e.target.closest('.no');
  if (no) {                                    // 卡片悬停 ✕：快捷负反馈
    e.stopPropagation();
    await postEvent(+no.closest('.card').dataset.id, 'dislike');
    toast('已记录负反馈，推荐已实时更新');
    refresh();
    return;
  }
  const act = e.target.closest('.act');        // 详情页动作（已由 onclick 处理）
  if (act) return;
  const mini = e.target.closest('.mini');      // 详情页相似推荐：切换详情
  if (mini) { openDetail(+mini.dataset.id); return; }
  const c = e.target.closest('.card');         // 首页卡片：打开详情页
  if (c) openDetail(+c.dataset.id);
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

function setMode(m) {
  curMode = m;
  $('modeFull').classList.toggle('on', m === 'full');
  $('modePopular').classList.toggle('on', m === 'popular');
  refresh();
}
$('modeFull').onclick = () => setMode('full');
$('modePopular').onclick = () => setMode('popular');
$('llmToggle').onclick = () => {
  llmOn = !llmOn;
  $('llmToggle').classList.toggle('on', llmOn);
  if (!llmOn) {
    const st = $('llmStatus');
    if (st) { st.className = ''; st.textContent = ''; }
    document.querySelectorAll('.reason').forEach(el => el.textContent = '');
    llmSeq++;   // 使在途响应过期
  } else {
    refresh();
  }
};
$('cmpToggle').onclick = () => {
  compareOn = !compareOn;
  $('cmpToggle').classList.toggle('on', compareOn);
  refresh();
};
$('channelChips').addEventListener('click', e => {
  const b = e.target.closest('.tch');
  if (!b) return;
  b.classList.toggle('on');
  refresh();
});
$('coarseSeg').onclick = e => {
  const b = e.target.closest('button[data-co]');
  if (!b) return;
  curCoarse = b.dataset.co;
  $('coarseSeg').querySelectorAll('button').forEach(
    x => x.classList.toggle('on', x === b));
  refresh();
};
$('userBtn').onclick = e => { e.stopPropagation(); toggleUserMenu(); };
$('userSearch').oninput = e => renderUserList(e.target.value);
$('userList').onclick = e => {
  const b = e.target.closest('.uitem');
  if (b) selectUser(+b.dataset.id);
};
$('newUserBtn').onclick = async e => {
  e.stopPropagation();
  try {
    const r = await (await fetch('/api/users', {method: 'POST'})).json();
    userPool.unshift({user_id: r.user_id, positives: 0});
    selectUser(r.user_id);
    toast(`已创建新用户 ${r.user_id}：冷启动走热门兜底，`
         + '在详情页喜欢几部电影后推荐将实时个性化');
  } catch (err) {
    toast('创建失败，请重试');
  }
};
document.addEventListener('click', e => {
  if (!e.target.closest('#userBox')) toggleUserMenu(false);
});
$('queryBtn').onclick = doQuery;
$('queryInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') doQuery();
});
$('refresh').onclick = refresh;

loadMeta();
loadUsers().then(refresh);
</script>
</body>
</html>
